name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy script syntax
        run: bash -n k8s/deploy.sh

      - name: Validate YAML manifests
        run: |
          python -m pip install --upgrade pip
          python -m pip install yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' k8s/backend-deployment.yaml k8s/ui-deployment.yaml

      - name: Validate docs and scripts formatting checks
        run: |
          git diff --check
