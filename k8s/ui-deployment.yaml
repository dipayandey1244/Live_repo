apiVersion: apps/v1
kind: Deployment
metadata:
  name: regression-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: regression-ui
  template:
    metadata:
      labels:
        app: regression-ui
    spec:
      containers:
        - name: ui
          image: registry.example.com/regression-ui:latest
          ports:
            - containerPort: 3000
          env:
            - name: API_BASE_URL
              value: http://regression-backend:8000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: regression-ui
spec:
  selector:
    app: regression-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
