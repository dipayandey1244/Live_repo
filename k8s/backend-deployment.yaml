apiVersion: apps/v1
kind: Deployment
metadata:
  name: regression-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: regression-backend
  template:
    metadata:
      labels:
        app: regression-backend
    spec:
      containers:
        - name: backend
          image: registry.example.com/regression-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: regression-backend
spec:
  selector:
    app: regression-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
